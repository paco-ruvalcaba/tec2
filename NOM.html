# ¿Qué es?
- **La Norma Oficial Mexicana que regula las instalaciones eléctricas de uso y utilización en México es la** **NOM‑001‑SEDE‑2012, Instalaciones Eléctricas (Utilización)**.
- Fue publicada por la Secretaría de Energía en el Diario Oficial de la Federación el **29 de noviembre de 2012** 

- Contiene los requisitos técnicos mínimos obligatorios para
  - diseño, 
  - instalación, 
  - puesta a tierra, 
  - protección y
  - mantenimiento. 

# Alcance y autoridad

- **Ámbito**: Aplica a las instalaciones eléctricas en edificaciones, locales y equipos conectados a la red de suministro eléctrico en México, tanto en baja como en media tensión según los capítulos aplicables. **La Secretaría de Energía** es la autoridad que la emitió.   

- **Documento oficial**: El texto completo y sus anexos están disponibles en PDF en fuentes técnicas y en el Diario Oficial; existen resúmenes técnicos y guías de cumplimiento elaboradas por organismos de normalización. 

# Requisitos clave

- **Dimensionamiento de conductores y canalizaciones**: criterios para capacidad de corriente, caída de tensión y selección de aislamiento.   
- **Protecciones**: interruptores termomagnéticos, fusibles y dispositivos de protección contra sobrecorriente y cortocircuito con coordinación adecuada.   

- **Puesta a tierra y conductores de protección**: esquemas, resistencias máximas y conexiones equipotenciales obligatorias.   
- **Instalaciones en lugares especiales**: requisitos específicos para hospitales, industrias, locales húmedos, piscinas y atmósferas explosivas.   
- **Inspección y mantenimiento**: obligaciones de propietarios y responsables para conservar la seguridad y realizar revisiones periódicas. 

# Cumplimiento, verificación y sanciones

- **Responsables**: el propietario o responsable de la instalación debe garantizar que el proyecto y la ejecución cumplan la NOM; las autoridades competentes pueden exigir constancias técnicas y realizar inspecciones.   
- **Consecuencias**: incumplimiento puede derivar en sanciones administrativas, suspensión de servicio o responsabilidades civiles por daños.
