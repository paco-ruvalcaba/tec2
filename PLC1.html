<body>
    <header>
        <h1></h1>

  <script src="https://google.github.io/typograms/typograms.js"></script>
  <script type="text/typogram">

    |                                                                                  |
    | I0 (START)        I1 (STOP)                        Q0 (MOTOR)                    |
    |---+--| |----------+---|/|----------------------------( )-------------------------|
    |   |               |                                                              |
    |   |    Q0 (MOTOR) |                                                              |
    |   '-----| |-------'                                                              |
    |	                                                                                 |
    |	                                                                                 |
    | Q0 (MOTOR)    I2 (PRESENCIA)    I3 (DEFECTO)    I4 (FC_PISTON)    Q1 (PISTON)    |
    |---+--| |--------------| |--------------| |--------------|/|----------+--( )------|
    |   |                                                                  |           |
    |   |                            Q1 (PISTON)                           |           |
    |   '--------------------------------| |-------------------------------'           |
    |                                                                                  |
    |                                                                                  |
  </script>
      
</body>
</html>
