# Slide 1: Portada y Bienvenida

<!-- .slide:  data-background-image="fondo_grinker.svg"  data-background="white" -->
### **Evolución del Cómputo: De las Máquinas Mecánicas a los Microprocesadores**

<!-- .slide:  data-background-image="fondo_grinker.svg"  data-background="white" -->
- **Tema:** Historia tecnológica del hardware computacional y la transición de lo mecánico a la microelectrónica.
- **Enfoque:** Entender cómo se pasó de engranajes físicos y bulbos de vacío a miles de millones de transistores en un solo chip de silicio.
- **Propósito:** Comprender las bases físicas que hicieron posible la era digital actual.
---
<!-- SLIDE 2 -->
<!-- .slide:  data-background-image="fondo_grinker.svg"  data-background="white" -->
# Slide 2: Objetivos de la Sesión

<!-- .slide:  data-background-image="fondo_grinker.svg"  data-background="white" -->
Al finalizar esta sesión, el estudiante será capaz de:

<!-- .slide:  data-background-image="fondo_grinker.svg"  data-background="white" -->

2. **Comprender** el funcionamiento y limitaciones de los tubos de vacío (bulbos).
3. **Explicar** el impacto del semiconductor y la invención del transistor en la física de computadores.

<!-- SLIDE 3 -->
# Slide 3: Era 1 - Computadoras Mecánicas

<!-- .slide:  data-background-image="fondo_grinker.svg"  data-background="white" -->
Antes del uso de la electricidad, el cálculo se realizaba mediante **mecanismos físicos de relojería, ruedas dentadas y palancas**.

<!-- .slide:  data-background-image="fondo_grinker.svg"  data-background="white" -->
### **Hitos Clave:**
- **La Pascalina (1642 - Blaise Pascal):**
  - Calculadora mecánica a base de engranajes para sumar y restar.
- **La Máquina Analítica (1837 - Charles Babbage):**
  - Diseñada con unidad de control, memoria y tarjetas perforadas (conceptualmente la primera computadora programable).
- **Máquina Tabuladora (1890 - Herman Hollerith):**
  - Utilizada para el censo de EE. UU. combinando mecánica con lectura eléctrica de tarjetas perforadas (origen de IBM).

<!-- .slide:  data-background-image="fondo_grinker.svg"  data-background="white" -->
> **Principio de Funcionamiento:** La información se almacenaba y procesaba en la posición física de un engranaje o eje giratorio.
---
<!-- .slide:  data-background-image="fondo_grinker.svg"  data-background="white" -->
<!-- SLIDE 4 -->
# Slide 4: La Transición Electromecánica

<!-- .slide:  data-background-image="fondo_grinker.svg"  data-background="white" -->
A principios del Siglo XX surgieron los dispositivos **electromecánicos**, que combinaban piezas móviles con impulsos eléctricos.

<!-- .slide:  data-background-image="fondo_grinker.svg"  data-background="white" -->
### **El Relé Electromecánico:**
- Interruptor magnético que se abría o cerraba al recibir una corriente eléctrica.
- Permitía representar los estados **0 (Abierto)** y **1 (Cerrado)**.

<!-- .slide:  data-background-image="fondo_grinker.svg"  data-background="white" -->
### **Ejemplo Emblemático: Harvard Mark I (1944)**
- Construida con más de 760,000 ruedas dentadas y miles de relés.
- Tenía 16 metros de largo y pesaba 5 toneladas.
- Realizaba una suma en 0.3 segundos, pero hacía un ruido ensordecedor debido al movimiento de sus partes mecánicas.
---
<!-- .slide:  data-background-image="fondo_grinker.svg"  data-background="white" -->
<!-- SLIDE 5 -->
# Slide 5: Era 2 - Computadoras Eléctricas a Base de Bulbos

<!-- .slide:  data-background-image="fondo_grinker.svg"  data-background="white" -->
La **1.ª Generación de Computadoras Electrónicas (1940 - 1956)** reemplazó los relés mecánicos por **tubos de vacío (bulbos)**.

<!-- .slide:  data-background-image="fondo_grinker.svg"  data-background="white" -->
### **¿Qué es un Bulbo / Tubo de Vacío?**
- Un ampolla de vidrio sin aire con electrodos internos que controla el flujo de electrones en el vacío.
- Funciona como un conmutador electrónico **sin piezas mecánicas móviles**, permitiendo operar miles de veces más rápido que un relé.

<!-- .slide:  data-background-image="fondo_grinker.svg"  data-background="white" -->
### **Hitos Destacados:**
- **ENIAC (1946):** Usaba 17,468 tubos de vacío, pesaba 27 toneladas y consumía 150 kW de potencia.
- **UNIVAC I (1951):** La primera computadora comercial producida masivamente.
---
<!-- .slide:  data-background-image="fondo_grinker.svg"  data-background="white" -->
<!-- SLIDE 6 -->
# Slide 6: Desafíos y Limitaciones de los Tubos de Vacío

<!-- .slide:  data-background-image="fondo_grinker.svg"  data-background="white" -->
A pesar de su velocidad para la época, los bulbos presentaban serias deficiencias técnicas:

<!-- .slide:  data-background-image="fondo_grinker.svg"  data-background="white" -->
```
+------------------+     +------------------+     +--------------------+
| ALTO CONSUMO DE  | --> | CALOR EXCESIVO   | --> | FALLAS CONSTANTES  |
| ENERGÍA (kW)     |     | Y FRAGILIDAD     |     | (Bulbos quemados)  |
+------------------+     +------------------+     +--------------------+
```

<!-- .slide:  data-background-image="fondo_grinker.svg"  data-background="white" -->
1. **Fragilidad:** Al ser de vidrio y tener filamentos incandescentes, se quemaban como focos domésticos.
2. **Generación de Calor:** Requerían gigantescos sistemas de refrigeración industrial.
3. **Tamaño Físico:** Ocupaban habitaciones enteras.
4. **Mantenimiento:** El personal dedicaba horas diarias a buscar y reemplazar bulbos defectuosos.
---
<!-- SLIDE 7 -->
# Slide 7: La Revolución de los Semiconductores (El Transistor)

En **1947**, John Bardeen, Walter Brattain y William Shockley (Laboratorios Bell) inventaron el **Transistor**, marcando el nacimiento de la 2.ª Generación (1956 - 1963).

### **¿Qué es un Semiconductor?**
- Un material (como el **Silicio** o Germanio) que puede conducir o bloquear la electricidad dependiendo de ciertas condiciones eléctricas.

### **Ventajas del Transistor sobre el Bulbo:**
- **Sin partes frágiles de vidrio ni filamentos.**
- **100 veces más pequeño**, consume una fracción de energía y genera muy poco calor.
- **Mayor confiabilidad y durabilidad:** Rara vez se "quema".

---

<!-- SLIDE 8 -->
# Slide 8: La Invención del Circuito Integrado (El Chip)

En la década de 1950, las computadoras usaban miles de transistores individuales soldados manualmente en placas de circuito, lo que limitaba la complejidad del sistema.

### **El Gran Avance (1958 - Jack Kilby y Robert Noyce):**
- **Circuito Integrado (CI / Chip):** Se logró fabricar **múltiples transistores, resistencias y capacitores en una sola pastilla de silicio**.

### **Impacto de la 3.ª Generación (1964 - 1971):**
- Reducción drástica de costos y tamaño.
- Aparición de los **Sistemas Operativos** y computadoras medianas (Minicomputadoras).

---

<!-- SLIDE 9 -->
# Slide 9: La Era del Microprocesador

La **4.ª Generación (1971 - Presente)** nació cuando se logró colocar **toda la CPU de una computadora en un solo chip de silicio**.

### **El Intel 4004 (1971):**
- Primer microprocesador comercial del mundo.
- Contenía **2,300 transistores** en un espacio diminuto.
---
### **Ley de Moore (Gordon Moore, cofundador de Intel):**

- Predicción empírica que señala que el número de transistores en un microprocesador se duplica aproximadamente cada dos años.
- *Hoy en día:* Un procesador moderno de smartphone contiene más de **15,000 millones de transistores**.
La Ley de Moore es una observación empírica formulada en 1965 por Gordon Moore, cofundador de Intel, que estableció que el número de transistores integrados en un microchip se duplica aproximadamente cada dos años, mientras que el costo de fabricación por componente disminuye.

## **Principios fundamentales**

* **Crecimiento exponencial:** Implica que el rendimiento y la velocidad de procesamiento de los ordenadores no crecen de forma lineal, sino que se multiplican con el tiempo.
* **Miniaturización:** Para duplicar la densidad sin agrandar el chip, la escala de los transistores se reduce constantemente hasta alcanzar dimensiones atómicas.
* **Reducción de costos:** Al fabricar componentes más pequeños de forma masiva, la capacidad de cómputo por dólar gastado mejora continuamente.

## **Impacto transformador**

| Área | Impacto directo de la Ley de Moore |
| --- | --- |
| **Dispositivos personales** | Transformó las computadoras de habitaciones enteras en teléfonos inteligentes portátiles más potentes. |
| **Medicina y diagnóstico** | Hizo posible procesar imágenes tridimensionales de tomografía y resonancia en tiempo real, así como acelerar la secuenciación genómica. |

| Área | Impacto directo de la Ley de Moore |
| --- | --- |
| **Inteligencia Artificial** | Suministró la potencia de cálculo bruta requerida para entrenar modelos de datos masivos y redes neuronales. |

## **Límites físicos y el futuro del cómputo**

En la actualidad, la Ley de Moore ha alcanzado una etapa de desaceleración debida a barreras insuperables de la física y la economía:

* **Tunelamiento cuántico:** Cuando los transistores miden apenas unos pocos nanómetros (2 nm o 3 nm), los electrones saltan las barreras de aislamiento, generando fugas de energía y errores.
* **Calor y consumo:** Agrupar miles de millones de transistores en milímetros cuadrados genera densidades térmicas difíciles de disipar.
* **Costos de fabricación:** La construcción de plantas fotolitográficas de ultravioleta extremo (EUV) exige inversiones de decenas de miles de millones de dólares.

Ante el límite de la miniaturización en silicio, la industria ha virado hacia la **arquitectura multinúcleo** (procesamiento en paralelo), procesadores especializados (como las GPU para gráficos y datos) y el desarrollo experimental de la computación cuántica.
---
<!-- SLIDE 10 -->
# Slide 10: Cuadro Comparativo de Generaciones

| Generación | Tecnología Principal | Elemento Clave | Tamaño | Velocidad | Ejemplo |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **Mecánica** | Engranajes / Tarjetas | Posición física | Edificios / Cuartos | Segundos por operación | Pascalina / Mark I |
| **1.ª Generación** | Tubos de Vacío (Bulbos) | Conmutación por vacío | Habitación gigante | Milisegundos | ENIAC |
| **2.ª Generación** | Transistores | Semiconductores discretos | Armarios grandes | Microsegundos | IBM 7090 |

| Generación | Tecnología Principal | Elemento Clave | Tamaño | Velocidad | Ejemplo |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **3.ª Generación** | Circuitos Integrados (Chips) | Silicio miniaturizado | Escritorio / Torre | Nanosegundos | IBM System/360 |
| **4.ª Generación** | Microprocesadores (VLSI) | CPU completa en un chip | Portátil / Bolsillo | Picosegundos / GHz | PCs, Smartphones |
---
<!-- SLIDE 11 -->
# Slide 11: Resumen y Conclusiones

1. La computación evolucionó de **movimientos físicos (engranajes)** a **impulsos electrónicos en semiconductores**.
2. Los **tubos de vacío (bulbos)** permitieron la primera computación electrónica, pero su calor, tamaño y fragilidad hicieron necesaria una sustitución.
3. El **transistor** y los **semiconductores** revolucionaron la física de materiales al controlar la corriente sin partes móviles ni bulbos.
4. El **circuito integrado (chip)** permitió integrar miles de componentes en una sola oblea de silicio.
5. El **microprocesador** concentró la CPU completa en un chip, dando inicio a la era de la computación personal, móvil y ubicua.
