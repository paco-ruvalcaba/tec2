# ![Cuadro Comparativo de Generaciones](https://yjxgm4nnyy.joplinusercontent.com/shares/0SbtqjcXuBOiCzd6Om4G1x)

| Generación | Tecnología Principal | Elemento Clave | Tamaño | Velocidad | Ejemplo |
| :--- | :--- | :--- | :--- | :--- | :--- |
| **Mecánica** | Engranajes / Tarjetas | Posición física | Edificios / Cuartos | Segundos por operación | Pascalina / Mark I |
| **1.ª Generación** | Tubos de Vacío (Bulbos) | Conmutación por vacío | Habitación gigante | Milisegundos | ENIAC |
| **2.ª Generación** | Transistores | Semiconductores discretos | Armarios grandes | Microsegundos | IBM 7090 |
| **3.ª Generación** | Circuitos Integrados (Chips) | Silicio miniaturizado | Escritorio / Torre | Nanosegundos | IBM System/360 |
| **4.ª Generación** | Microprocesadores (VLSI) | CPU completa en un chip | Portátil / Bolsillo | Picosegundos / GHz | PCs, Smartphones |
