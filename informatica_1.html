# 1: Portada y Bienvenida

### **Unidad 1: Introducción a la Informática**
*Curso de Alfabetización Informática (LM-105)*
- **Tema:** Conceptos fundamentales, orígenes y rol de las tecnologías de la información.
- **Dirigido a:** Estudiantes de primer semestre.
- **Propósito:** Construir las bases teóricas y conceptuales necesarias para la interacción efectiva con sistemas de cómputo y tecnología digital.
---
<!-- 2 -->
# 2: Objetivos de Aprendizaje

Al finalizar esta sesión, el estudiante será capaz de:
1. **Definir** el concepto de informática y diferenciarlo de la computación.
2. **Diferenciar** con claridad entre *Dato*, *Información* y *Conocimiento*.
3. **Comprender** el ciclo elemental de procesamiento de información (Entrada → Proceso → Salida → Almacenamiento).
4. **Identificar** la estructura general de un sistema informático (Hardware, Software, Humanware).
5. **Reconocer** la importancia de la informática aplicada al ámbito profesional, con especial énfasis en el sector salud.

---
<!-- 3 -->
# 3: ¿Qué es la Informática?

### **Origen Etimológico**
La palabra **Informática** proviene de la conjunción de dos términos en francés (*Informatique*, acuñado por Philippe Dreyfus en 1962):
$$	ext{INFORmación} + auTOmÁTICA = 	extbf{INFORMÁTICA}$$
### **Definición Formal**
Es la **ciencia y conjunto de técnicas** dedicadas al tratamiento **automático y racional** de la información mediante el uso de dispositivos electrónicos y sistemas computacionales.
### **Diferencia Clave**
- **Computación:** Se centra en el estudio teórico del cálculo, los algoritmos y la arquitectura de las máquinas.
- **Informática:** Se enfoca en la **gestión, almacenamiento, procesamiento y transmisión** de la información para resolver problemas prácticos.
---
<!-- 4 -->
# 4: Conceptos Clave: Dato, Información y Conocimiento

| Concepto | Definición | Ejemplo (Entorno General) | Ejemplo (Entorno Salud) |
| :--- | :--- | :--- | :--- |
| **Dato** | Cifra, símbolo o hecho bruto sin contexto ni significado por sí solo. | `38.5` | `38.5` |
| **Información** | Conjunto de datos procesados, estructurados y con contexto útil. | `Temperatura corporal = 38.5 °C` | `Paciente Juan Pérez presenta 38.5 °C de fiebre.` |
| **Conocimiento** | Comprensión y aplicación de la información para la toma de decisiones. | `Entender que >37.5 °C indica hipertermia.` | `Diagnosticar un síndrome febril e iniciar protocolo clínico.` |
> *"Los datos son la materia prima; la información es el producto elaborado; el conocimiento es la acción con propósito."*
---
<!-- 5 -->
# 5: El Ciclo del Procesamiento de la Información
Todo sistema informático opera bajo una secuencia lógica fundamental:
```
+------------------+     +--------------------+     +-------------------+
|  1. ENTRADA      | --> |  2. PROCESAMIENTO  | --> |  3. SALIDA        |
|  (Captura Datos) |     |  (Cálculo/Lógica)  |     |  (Resultados/UIs) |
+------------------+     +--------------------+     +-------------------+
                                   |
                                   v
                         +--------------------+
                         | 4. ALMACENAMIENTO  |
                         | (Disco/Nube/RAM)   |
                         +--------------------+
```
1. **Entrada (Input):** Ingreso de datos mediante periféricos (teclado, ratón, escáner, sensores).
2. **Procesamiento (Processing):** Transformación de datos realizada por el procesador (CPU) siguiendo instrucciones de un programa.
3. **Salida (Output):** Despliegue de resultados a través de pantallas, impresoras, reportes o alertas.
4. **Almacenamiento (Storage):** Guardado permanente o temporal de la información procesada.
---
<!-- 6 -->
# 6: Breve Evolución Histórica de la Computación

- **Antecedentes:** Ábaco (antigüedad), Mecanismo de Anticitera, Pascalina (1642), Máquina Analítica de Babbage (1837).
- **1.ª Generación (1940-1956) - Tubos de Vacío:** ENIAC, UNIVAC. Enormes, consumían mucha energía y usaban lenguaje máquina.
- **2.ª Generación (1956-1963) - Transistores:** Reducción de tamaño, mayor velocidad y nacimiento de lenguajes de alto nivel (FORTRAN, COBOL).
- **3.ª Generación (1964-1971) - Circuitos Integrados:** Chips de silicio, apariciones de sistemas operativos primitivos.
- **4.ª Generación (1971-Presente) - Microprocesadores:** Nacimiento de la PC personal (IBM PC, Apple II). Integración a gran escala (VLSI).
- **5.ª Generación (Presente y Futuro) - IA y Computación Cuántica:** Inteligencia artificial, procesamiento en la nube, sistemas paralelos y computación cuántica.
---
<!-- 7 -->
# 7: Arquitectura Básica (Modelo Von Neumann)

Propuesto por John von Neumann en 1945, describe la estructura conceptual básica de casi todas las computadoras modernas:
* **CPU (Unidad Central de Procesamiento):**
  - **ALU (Unidad Aritmético-Lógica):** Realiza operaciones matemáticas y lógicas.
  - **UC (Unidad de Control):** Coordina y dirige el flujo de datos e instrucciones.
  - **Registros:** Memoria ultra-rápida de trabajo interno.
* **Memoria Principal (RAM):** Almacena volátilmente programas y datos en ejecución.
* **Unidades de Entrada / Salida (E/S):** Interfaz entre la máquina y el mundo exterior.
* **Buses de Sistema:** Vías físicas de comunicación (Datos, Dirección y Control).
---
<!-- 8 -->
# 8: Pilares del Sistema Informático

Un sistema informático funcional requiere la integración armónica de tres componentes:

### 1. **Hardware (Componente Físico)**
- Todo lo tangible: monitor, procesador, memoria, cables, periféricos.

### 2. **Software (Componente Lógico)**
- Intangible: conjunto de programas, instrucciones y reglas informáticas.
  - *Software de Sistema:* Sistemas operativos (Windows, macOS, Linux).
  - *Software de Aplicación:* Procesadores de texto, navegadores, software médico.

### 3. **Humanware / Orgware (Componente Humano)**
- Las personas que diseñan, programan, administran y utilizan la tecnología (usuarios finales, ingenieros, médicos, estudiantes).
---
<!-- 9 -->
# 9: Clasificación de los Sistemas Computacionales

Según su potencia, tamaño y propósito de uso:

1. **Supercomputadoras:** Máquinas de alto rendimiento para simulación científica, clima, modelado molecular y física cuántica (ej. *Frontier*, *Fugaku*).
2. **Servidores y Mainframes:** Diseñados para procesar millones de transacciones simultáneas, bases de datos masivas e infraestructura empresarial.
3. **Computadoras Personales (PC y Laptops):** Orientadas al trabajo individual, oficina, educación y entretenimiento.
4. **Dispositivos Móviles (Smartphones y Tablets):** Cómputo ultraportátil con pantalla táctil e integración constante a internet.
5. **Sistemas Embebidos e IoT (Internet de las Cosas):** Microcontroladores integrados en aparatos domésticos, automóviles y equipos médicos (ej. marcapasos inteligentes, monitores de signos vitales).
---
<!-- 10 -->
# 10: Importancia de la Informática en el Ámbito Profesional y la Salud

La informática no es solo una herramienta, sino un catalizador fundamental en el entorno profesional contemporáneo:

- **Expediente Clínico Electrónico (ECE):** Centralización y acceso seguro a la historia médica del paciente.
- **Telemedicina y Salud Digital:** Consultas a distancia, monitoreo remoto de pacientes y diagnóstico preventivo.
- **Bases de Datos Científicas:** Acceso instantáneo a literatura médica actualizada (PubMed, SciELO, Scopus).
- **Análisis de Datos y Biadistribuida:** Descubrimiento de patrones epidémicos, genética computacional e investigación clínica.
- **Automatización de Procesos:** Reducción de errores humanos, gestión hospitalaria y optimización de recursos.

---
<!-- 11 -->
# 11: Desafíos Actuación: Brecha Digital y Ética

A medida que avanza la adopción tecnológica, surgen retos cruciales:

- **Brecha Digital:**
  - Desigualdad en el acceso, uso y apropiación de las TIC según factores geográficos, socioeconómicos y generacionales.
- **Alfabetización Digital:**
  - Desarrollo de habilidades no solo operativas (saber usar una máquina), sino críticas (evaluar información, proteger datos personales, comunicación responsable).
- **Seguridad y Privacidad:**
  - Protección de datos sensibles (Ley de protección de datos, confidencialidad médica, prevención de ciberataques).

---
<!-- 12 -->
# 12: Resumen y Puntos Clave

1. La **Informática** es la ciencia del tratamiento automático y racional de la información.
2. Los datos aislados no aportan valor hasta que son procesados para convertirse en **información** útil y **conocimiento** aplicable.
3. El ciclo computacional abarca **Entrada $
ightarrow$ Procesamiento $
ightarrow$ Salida $
ightarrow$ Almacenamiento**.
4. Un sistema informático exitoso requiere el equilibrio entre **Hardware**, **Software** y **Humanware**.
5. La **Alfabetización Informática** es una competencia indispensable para la práctica profesional moderna y el acceso democrático al conocimiento.
